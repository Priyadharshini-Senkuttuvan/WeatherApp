<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Weather App</title>

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-900 min-h-screen flex items-center justify-center">

  <div class="bg-slate-800 p-6 rounded-2xl w-80 sm:w-96 text-center shadow-2xl border border-slate-700">

    <h1 class="text-2xl text-white font-bold mb-8">
      🌦 Weather App
    </h1>

    <!-- Input -->
    <input
      type="text"
      id="cityInput"
      placeholder="Enter city name"
      class="w-full px-4 py-2 rounded-lg mb-4 bg-slate-700 text-white outline-none focus:ring-2 focus:ring-emerald-400"
    />

    <!-- Button -->
    <button
      onclick="getWeather()"
      class="w-full bg-emerald-500 hover:bg-emerald-600 transition-all duration-200 text-white py-2 rounded-lg font-semibold"
    >
      Get Weather
    </button>

    

    <!-- Result Card -->
    <div
      id="weatherResult"
      class="hidden mt-6 bg-slate-900 rounded-xl p-4 text-slate-200 border border-slate-700"
    >
      <h2
        id="cityName"
        class="text-2xl font-bold text-emerald-400 mb-4"
      ></h2>

       <!-- Weather Icon -->
  <img id="weatherIcon" class="mx-auto w-20 h-20 mb-4" />

      <div class="flex flex-col gap-3 text-sm">
        <p id="temperature" class="text-xl text-center mb-4 font-bold"></p>
        <p id="condition" class="text-xl text-center mb-4 font-bold"></p>
        <p id="humidity" class="text-xl text-center font-bold"></p>
      </div>
    </div>

  </div>

  <script src="./index.js"></script>
</body>
</html>
